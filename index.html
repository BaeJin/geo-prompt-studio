<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Prompt Studio</title><link rel="stylesheet" href="styles.css"><script type="module" src="app.mjs"></script></head>
<body>
<header class="topbar"><a class="brand" href="#templates">Prompt Studio <span>DATACAST</span></a><div class="top-actions"><a class="service-link" href="https://baejin.github.io/geo-prompt-studio/responses/">응답 결과</a><span id="save-state" class="save-state" title="설정은 현재 브라우저에 저장됩니다.">브라우저 저장</span><button id="load-config" class="quiet">설정 가져오기</button><button id="save-config" class="quiet">설정 내보내기</button><input id="config-file" type="file" accept=".json,application/json" hidden></div></header>
<nav class="app-nav" aria-label="작업 공간"><button id="templates-nav" class="active" aria-current="page">템플릿</button><button id="parameters-nav">파라미터</button><button id="compose-nav">프롬프트 생성</button></nav>
<main><section id="library-view" aria-label="라이브러리">
<section id="templates-view" aria-label="템플릿 관리"><div class="view-toolbar"><h1>템플릿 <span id="template-badge" class="badge"></span></h1><div class="toolbar-actions"><input id="template-search" type="search" aria-label="템플릿 검색" placeholder="템플릿 검색"><button id="add-template-set" class="primary">템플릿 추가</button></div></div><div class="table-scroll"><table class="library-table"><thead><tr><th scope="col">이름</th><th scope="col">질문</th><th scope="col" class="number-col">문장 수</th><th scope="col" class="actions-col">관리</th></tr></thead><tbody id="template-library"></tbody></table></div></section>
<section id="parameters-view" aria-label="파라미터 관리" hidden><div class="view-toolbar"><h1>파라미터 <span id="parameter-badge" class="badge"></span></h1><div class="toolbar-actions"><input id="parameter-search" type="search" aria-label="파라미터 검색" placeholder="파라미터 검색"><button id="add-parameter-set" class="primary">파라미터 추가</button></div></div><div class="table-scroll"><table class="library-table"><thead><tr><th scope="col">이름</th><th scope="col">값</th><th scope="col" class="number-col">값 수</th><th scope="col" class="actions-col">관리</th></tr></thead><tbody id="parameter-library"></tbody></table></div></section>
</section>
<section id="compose-view" aria-label="프롬프트 생성" hidden><div class="view-toolbar"><h1>프롬프트 생성</h1><button id="sample-combinations" class="outline">샘플 불러오기</button></div><div class="workspace">
<section class="composer panel" aria-label="조합 설정"><div class="panel-heading"><h2>조합 <span id="combination-count" class="badge">0</span></h2><button id="clear-combinations" class="quiet">모두 비우기</button></div><div class="loader"><label class="field-label" for="template-picker">템플릿</label><div class="load-row"><select id="template-picker"></select><button id="load-template" class="outline">추가</button></div></div><div id="combination-list" class="combination-list"></div><div class="editor-footer"><label class="check"><input id="dedupe" type="checkbox" checked>중복 제외</label><button id="generate" class="primary">생성</button></div></section>
<section class="preview panel" aria-label="생성 결과"><div class="panel-heading"><h2>결과 <span id="preview-count" class="badge">0</span></h2><span id="result-state" class="status">생성 전</span></div><div class="result-tools"><input id="search" type="search" placeholder="결과 검색" aria-label="결과 검색"><button id="select-all" class="quiet">전체 선택</button></div><p id="result-summary" class="result-summary" aria-live="polite">생성된 프롬프트가 없습니다.</p><div id="errors" class="errors" role="alert" hidden></div><div class="results-head"><span>선택</span><span>프롬프트</span></div><div id="results" class="results"></div><div class="pagination"><span id="page-info"></span><div><button id="previous" class="quiet" aria-label="이전 페이지">이전</button><button id="next" class="quiet" aria-label="다음 페이지">다음</button></div></div><div class="export-footer"><span id="selection-count">0개 선택</span><button id="export" class="primary" disabled>CSV 다운로드</button></div></section>
</div></section></main>
<dialog id="library-editor" class="library-editor" aria-labelledby="editor-title"><form id="library-form"><div class="modal-heading"><h2 id="editor-title"></h2><button type="button" id="close-editor" class="quiet close" aria-label="편집 닫기">×</button></div><label class="field-label" for="draft-name">이름</label><input id="draft-name" maxlength="200" required><p id="draft-help" class="hint"></p><div id="draft-items"></div><button id="add-draft-item" type="button" class="outline"></button><p id="draft-error" class="errors" role="alert" hidden></p><div class="dialog-actions"><button type="button" id="cancel-editor" class="outline">취소</button><button type="submit" class="primary">저장</button></div></form></dialog>
<div id="toast" role="status" class="toast" hidden></div><dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-description"></p><div class="dialog-actions"><button id="cancel-confirm" class="outline">취소</button><button id="accept-confirm" class="primary">확인</button></div></dialog>
</body></html>
